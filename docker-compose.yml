services:
  habitahub:
    build: .
    image: habitahub-prototipo
    container_name: habitahub
    ports:
      - "3100:80"
    restart: unless-stopped

  # Banco de dados em container próprio. Um servidor PostgreSQL com um banco
  # por produto da linha. Credenciais só para desenvolvimento local.
  banco:
    image: postgres:17-alpine
    container_name: habitahub-banco
    environment:
      POSTGRES_USER: habitahub
      POSTGRES_PASSWORD: habitahub
      POSTGRES_DB: habitahub_completo
    ports:
      - "5433:5432"
    volumes:
      - dados-banco:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U habitahub -d habitahub_completo"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Mesma imagem, dois produtos da linha (LPS): mudam o produto e o banco.
  sistema-completo:
    build: ./sistema
    image: habitahub-sistema
    container_name: habitahub-completo
    environment:
      HABITAHUB_PRODUTO: completo
      TZ: America/Sao_Paulo # datas "de hoje" (início de contrato) no fuso local
      HABITAHUB_BANCO_URL: postgres://habitahub:habitahub@banco:5432/habitahub_completo
    ports:
      - "3200:3200"
    depends_on:
      banco:
        condition: service_healthy
    restart: unless-stopped

  sistema-essencial:
    image: habitahub-sistema
    container_name: habitahub-essencial
    environment:
      HABITAHUB_PRODUTO: essencial
      TZ: America/Sao_Paulo
      HABITAHUB_BANCO_URL: postgres://habitahub:habitahub@banco:5432/habitahub_essencial
    ports:
      - "3201:3200"
    depends_on:
      banco:
        condition: service_healthy
      sistema-completo:
        condition: service_started
    restart: unless-stopped

volumes:
  dados-banco:
