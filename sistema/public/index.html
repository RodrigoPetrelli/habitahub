<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HabitaHub</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <!-- Tela de login (mesmo layout do protótipo: marca + cartão centralizado). -->
  <div class="auth-wrap hidden" id="tela-login"></div>

  <!-- Mesmo shell do protótipo (prototipo/js/app.js): topbar, sidebar e área principal. -->
  <div class="shell hidden" id="shell">
    <header class="topbar">
      <button class="icon-btn menu-toggle" id="menu-toggle" aria-label="Menu">☰</button>
      <a class="logo" href="#/inicio">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9.5 14.5h5"/></svg>
        HabitaHub
      </a>
      <div class="spacer"></div>
      <span class="produto" id="produto-nome"></span>
      <span class="user-chip" id="usuario"></span>
      <button class="btn btn-sm" id="sair">Sair</button>
    </header>
    <nav class="sidebar" id="menu"></nav>
    <main class="main" id="conteudo"></main>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
