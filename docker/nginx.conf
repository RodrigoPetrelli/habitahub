server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # SPA com roteamento por hash: tudo cai no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Protótipo em evolução: evita cache desatualizado de JS/CSS
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-store";
    }

    # Documentação interna das fatias não precisa ser servida
    location = /README.md { return 404; }

    gzip on;
    gzip_types text/css application/javascript text/html;
}
